const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);

const dow=d=>(d.getDay()+6)%7;
const monday=d=>addDays(d,-dow(d));
const cap=s=>s.slice(0,1).toUpperCase()+s.slice(1);

function productImage(id, variant='small'){
 const p=PRODUCTS[id];if(!p)return '';
 const pic=PRODUCT_PHOTOS[id];if(!pic)return `<span class="product-ico ${p.tone==='blue'?'blue':''}">${esc(p.abbr)}</span>`;
 return `<span class="product-ico has-photo type-${esc(id)} ${variant==='large'?'photo-large':''} ${pic.unverified?'photo-unverified':''}" aria-label="${esc(p.name)}"><span class="fallback-abbr" aria-hidden="true">${esc(p.abbr)}</span><img src="${esc(pic.url)}" alt="" loading="${variant==='large'?'eager':'lazy'}" decoding="async" referrerpolicy="no-referrer"></span>`;

function productPhotoHero(id){
 const p=PRODUCTS[id],pic=PRODUCT_PHOTOS[id];if(!pic)return productImage(id,'large');
 return `<div class="product-hero"><div class="product-hero-picture">${productImage(id,'large')}</div><div class="product-hero-info"><span class="eyebrow2">${esc(p.group)}</span><div class="photo-marker">${pic.unverified?'Упаковка не подтверждена':'Фото товара'}</div><p>${pic.unverified?'Для Aronyx точная версия не установлена — сверь название на флаконе.':'Если снимок недоступен, показывается нейтральная подпись средства.'}</p><a href="${esc(pic.href)}" target="_blank" rel="noopener noreferrer">Открыть фото ↗</a></div></div>`;

   if(img.naturalWidth>0)img.closest('.product-ico').classList.add('is-loaded');
 }
},true);
document.addEventListener('error',e=>{
 const img=e.target;if(img instanceof HTMLImageElement && img.closest('.product-ico.has-photo')){
   img.closest('.product-ico').classList.add('missing-photo');
 }
},true);

const stages=[
 {from:0,to:6,short:'Неделя 1',name:'Упростить уход',description:'Вода утром, SPF, вечером бальзам при SPF, одна пенка и немного крема. Без кислот, Axis-Y и энзимной пудры.',accent:'green'},
 {from:7,to:13,short:'Неделя 2',name:'Проверить комфорт кожи',description:'Продолжай базовый уход. Если хочется, добавь Torriden в отдельные утра; крем — только тонким слоем.',accent:'green'},
 {from:14,to:20,short:'Неделя 3',name:'Начать Скинорен · 2 вечера',description:'Только после проверки переносимости и когда стянутость уменьшилась. Два вечера с интервалом в несколько дней.',accent:'purple',approval:'start'},
 {from:21,to:27,short:'Неделя 4',name:'Скинорен · до 3 вечеров',description:'Не увеличивай частоту без подтверждения переносимости. Если не готов — оставайся на предыдущем режиме.',accent:'purple',approval:'three'},
 {from:28,to:41,short:'Недели 5–6',name:'Скинорен через вечер',description:'Только если нет стойкого раздражения. На свободные вечера можно вернуть Axis-Y, но он не обязателен.',accent:'purple',approval:'alternate'},
 {from:42,to:55,short:'Недели 7–8',name:'Оценить ежедневное применение',description:'При хорошей переносимости можно перейти к одному нанесению вечером. Переход к применению дважды в день — после консультации.',accent:'purple',approval:'daily'},
 {from:56,to:83,short:'Недели 9–12',name:'Стабильный режим и оценка',description:'Сохраняй частоту, которую кожа переносит. Сравни фотографии; при отсутствии улучшения или появлении рубчиков обратись к дерматологу.',accent:'purple'},
 {from:84,to:Infinity,short:'После 12-й недели',name:'Поддержание результата',description:'Не добавляй BHA автоматически. Оставь комфортный режим и согласуй дальнейшее лечение с дерматологом.',accent:'green'}
];
const approvals=[{key:'start',name:'Начать Скинорен',week:'с 3-й недели',note:'Кожа комфортна, средство куплено, проба на небольшом участке не вызвала реакции.'},{key:'three',name:'До 3 вечеров в неделю',week:'с 4-й недели',note:'Два нанесения в неделю переносились без стойкого жжения и шелушения.'},{key:'alternate',name:'Через вечер',week:'с 5-й недели',note:'Три нанесения в неделю переносились хорошо.'},{key:'daily',name:'Каждый вечер',week:'с 7-й недели',note:'Режим через вечер переносился хорошо; нет выраженного раздражения.'}];
const approvalNeeded=['start','three','alternate','daily'];
const idxFor=d=>diffDays(d,parse(state.startDate));
const stageFor=d=>{const n=idxFor(d);return n<0?{from:-1,to:-1,short:'До старта',name:'Подготовка',description:'Старт программы ещё не наступил.',accent:'green'}:stages.find(p=>p.from<=n&&n<=p.to)};
const phaseNumber=d=>Math.max(1,Math.floor(idxFor(d)/7)+1);
const approvedActive=(key,n)=>{const order=approvalNeeded.indexOf(key);return n>=stages[[2,3,4,5][order]].from && approvalNeeded.slice(0,order+1).every(k=>state.approved[k])};
const getIntensity=d=>{const n=idxFor(d);if(n<14||!approvedActive('start',n))return 0;if(n>=42&&approvedActive('daily',n))return 4;if(n>=28&&approvedActive('alternate',n))return 3;if(n>=21&&approvedActive('three',n))return 2;return 1};
function treatmentDay(d){const n=idxFor(d),i=getIntensity(d);if(i===0)return false;if(i===4)return true;if(i===3)return (n-28)%2===0;if(i===2)return [0,2,4].includes(n%7);return [0,3].includes(n%7)}
const step=(id,key,desc,optional=false)=>({id,key,desc,optional});
function routineFor(d){const n=idxFor(d);if(n<0)return {am:[],pm:[],note:'Программа ещё не началась. Открой настройки, чтобы изменить дату старта.',treatment:false};
 const am=[step('water','water','Умыться тёплой водой, без пенки')];
 if(n>=7)am.push(step('torriden','torriden','2–3 капли, только если хочется увлажнения',true));
 am.push(step('cream-am','cream','Маленькая горошина, только при стянутости',true));
 am.push(step('sunscreen','sunscreen','Щедрый равномерный слой, не сокращать дозу'));
 const pm=[step('balm','balm','На сухую кожу, затем эмульгировать водой; если был SPF'),step('dokdo','dokdo','Мягко умыться одной пенкой')];
 const treatment=treatmentDay(d);
 if(treatment)pm.push(step('skinoren','skinoren','На полностью сухую кожу, тонко по зонам акне'));
 else if(n>=28&&n%7===2||!treatment&&n>=28&&n%7===5)pm.push(step('axis','axis','Тонким слоем в вечер без Скинорена',true));
 else if(n>=7&&n%7===2&&!treatment)pm.push(step('torriden-pm','torriden','Необязательная сыворотка для комфорта',true));
 pm.push(step('cream-pm','cream',treatment?'После впитывания Скинорена, тонко, при необходимости':'Маленькая горошина, тонким слоем',false));
 let note=n<7?'Первая неделя: убираем лишние слои и следим за стянутостью и блеском после крема.':n<14?'Если кожа комфортная, допускается один дополнительный слой Torriden. Новые кислоты пока не используем.':!state.approved.start?'Этап Скинорена ещё не подтверждён. Пока выполняй базовый уход.':treatment?'Сегодня вечер со Скинореном. Не добавляй BHA, энзимную пудру и другие новые активы.':'Сегодня вечер без Скинорена: поддерживаем комфорт кожи.';
 return {am,pm,note,treatment};}
const getSteps=d=>{const r=routineFor(d);return [...r.am,...r.pm].filter(s=>!s.optional)};
const progressFor=d=>{const list=getSteps(d),ds=state.done[iso(d)]||{};return {total:list.length,done:list.filter(s=>!!ds[s.id]).length,all:list.length>0&&list.every(s=>!!ds[s.id])}};
const pctFor=d=>{const p=progressFor(d);return p.total?Math.round(p.done/p.total*100):0};
const isToday=d=>iso(d)===iso(today());

const journalFields=[{key:'oil',label:'Жирность',hint:'0 — нет блеска, 5 — очень выраженная'},{key:'tight',label:'Стянутость',hint:'0 — нет, 5 — сильно выраженная'},{key:'red',label:'Покраснение',hint:'0 — нет, 5 — выраженное'},{key:'irritation',label:'Жжение или раздражение',hint:'0 — нет, 5 — сильное'},{key:'comfort',label:'Комфорт кожи',hint:'0 — некомфортно, 5 — комфортно'}];
const safeMetric=n=>Math.max(0,Math.min(5,Number.isFinite(Number(n))?Math.round(Number(n)):0));
const dayEntry=d=>state.journal[iso(d)]||null;
const simpleMode=d=>!!state.minimalDays[iso(d)];
const applyTheme=()=>{const t=state.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.theme;document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]')?.setAttribute('content',t==='dark'?'#151c18':'#f6f7f4')};
applyTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')applyTheme()})}catch(e){}
const showCheckin=d=>{const entry=dayEntry(d)||{};const markup=journalFields.map(f=>`<div class="form-line"><label for="field-${f.key}">${f.label} <output id="value-${f.key}">${entry[f.key]===undefined?'0':safeMetric(entry[f.key])}/5</output></label><input id="field-${f.key}" type="range" data-range="${f.key}" min="0" max="5" step="1" value="${entry[f.key]===undefined?'0':safeMetric(entry[f.key])}"><div class="field-hint">${f.hint}</div></div>`).join('');showModal(`<div class="eyebrow2">Дневник кожи</div><h2 id="modal-title">Как кожа сегодня?</h2><p class="lead">${esc(fullDate(d))}. Это субъективные наблюдения, не медицинская диагностика.</p><div class="journal-form" data-journal-date="${iso(d)}">${markup}<div class="form-line"><label for="field-breakouts">Новые воспаления <output id="value-breakouts">${Math.max(0,Math.min(20,Number(entry.breakouts)||0))}</output></label><input id="field-breakouts" type="range" data-range="breakouts" min="0" max="20" step="1" value="${Math.max(0,Math.min(20,Number(entry.breakouts)||0))}"></div><label class="settings-label" for="field-notes">Заметки (необязательно)</label><textarea class="notes-area" id="field-notes" maxlength="350" placeholder="Например: после крема меньше блеска…">${esc(entry.notes||'')}</textarea><p class="field-hint">Запись сохраняется только на этом устройстве.</p><div class="modal-actions"><button class="modal-action" data-action="save-checkin" data-jdate="${iso(d)}">Сохранить наблюдение</button><button class="modal-action secondary" data-action="close">Отмена</button></div></div>`)};
function journalShort(d){const e=dayEntry(d);return `<section class="card journal-summary"><div class="section-top"><h3>Состояние кожи</h3><button data-view="journal">Дневник →</button></div>${e?`<div class="journal-block"><div class="metric-row"><span class="metric-label">Жирность</span><b class="metric-num">${safeMetric(e.oil)}/5</b></div><div class="metric-row"><span class="metric-label">Стянутость</span><b class="metric-num">${safeMetric(e.tight)}/5</b></div><div class="metric-row"><span class="metric-label">Комфорт</span><b class="metric-num">${safeMetric(e.comfort)}/5</b></div></div>`:`<p style="margin-top:12px">Отмечай ощущения — так будет проще понять, влияет ли количество крема на жирность.</p>`}<button class="quiet-action" data-checkin="${iso(d)}">${e?'Изменить запись':'Записать состояние кожи'} ${svg('chevron','tiny')}</button></section>`}
function journalPlot(entries){const W=620,H=224,px=34,py=23,innerW=W-60,innerH=H-62;let grid='';for(let i=0;i<=5;i++){const yy=py+innerH-i/5*innerH;grid+=`<line x1="${px}" x2="${px+innerW}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="9" y="${yy+4}" font-size="11" fill="var(--muted)">${i}</text>`}if(!entries.length)return `<div class="journal-empty">Записей пока нет. После первого check-in здесь появятся измерения за последние 30 дней.</div>`;const points=entries.map(([dt,e])=>{const shift=diffDays(parse(dt),addDays(today(),-29));return{x:px+shift/29*innerW,y:py+innerH-safeMetric(e.oil)/5*innerH,d:dt,e}});const path=points.map((p,i)=>`${i?'L':'M'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');return `<svg class="chart-svg" role="img" aria-label="График субъективной жирности кожи за последние 30 дней" viewBox="0 0 ${W} ${H}">${grid}<path d="${path}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${points.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--paper)" stroke="var(--green)" stroke-width="2.2"><title>${p.d}: ${safeMetric(p.e.oil)}/5</title></circle>`).join('')}<text x="${px}" y="${H-9}" fill="var(--muted)" font-size="11">30 дней назад</text><text x="${px+innerW}" y="${H-9}" text-anchor="end" fill="var(--muted)" font-size="11">Сегодня</text></svg>`}
function journalView(){const entries=Object.entries(state.journal).filter(([dt,v])=>dateValid(dt)&&v&&diffDays(today(),parse(dt))>=0&&diffDays(today(),parse(dt))<=29).sort((a,b)=>a[0].localeCompare(b[0]));const len=entries.length;const avg=k=>len?(entries.reduce((t,[_,e])=>t+safeMetric(e[k]),0)/len).toFixed(1):'—';const recent=Object.entries(state.journal).filter(([dt])=>dateValid(dt)).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,10);const high=entries.some(([d,e])=>safeMetric(e.irritation)>=3);return `<section class="view-section">${header('Дневник')}${hero('Наблюдай. Не угадывай.','Дневник кожи','Ощущения и изменения, которые ты отмечаешь сам. Всё хранится локально.')}
<div class="micro-actions"><div class="left"><button class="quiet-action active" data-checkin="${iso(state.selected)}">${svg('pen','tiny')} Записать: ${fmt(state.selected)}</button><button class="quiet-action" data-view="day">К уходу на день →</button></div><span class="micro-caption">Нет оценок — нет выдуманных графиков</span></div>
${high?`<div class="simple-alert">В записях есть раздражение от 3/5. Не повышай частоту Скинорена без оценки переносимости. При выраженной реакции прекрати применение и обратись к врачу.</div>`:''}
<div class="journal-grid"><div class="stack"><section class="card journal-card"><div class="chart-head"><div><h2>Жирность кожи</h2><p>По твоим записям за последние 30 дней · шкала 0–5</p></div><span class="chart-key">Жирность</span></div>${journalPlot(entries)}</section><section class="card journal-card"><div class="chart-head"><div><h2>Последние записи</h2><p>Нажми на дату, чтобы изменить наблюдение.</p></div></div>${recent.length?`<div class="journal-log">${recent.map(([d,e])=>`<button data-checkin="${d}"><span><span class="d">${esc(fullDate(parse(d)))}</span><span class="m">Жирность ${safeMetric(e.oil)}/5 · Стянутость ${safeMetric(e.tight)}/5 · Комфорт ${safeMetric(e.comfort)}/5</span></span>${svg('chevron','tiny')}</button>`).join('')}</div>`:'<div class="journal-empty">Здесь появятся записи после первого наблюдения.</div>'}</section></div>
<div class="stack"><section class="card journal-card"><div class="chart-head"><div><h2>Последние 30 дней</h2><p>Наблюдения без медицинской интерпретации.</p></div></div><div class="stat-grid"><div class="stat"><strong>${len}</strong><small>дней с записями</small></div><div class="stat"><strong>${avg('oil')}</strong><small>жирность / 5</small></div><div class="stat"><strong>${avg('comfort')}</strong><small>комфорт / 5</small></div></div><div class="wellness-bars">${journalFields.map(f=>`<div class="wellness-row"><span>${f.label}</span><b>${avg(f.key)}${len?'/5':''}</b><div class="meter"><i style="width:${len?Number(avg(f.key))*20:0}%"></i></div></div>`).join('')}</div></section><section class="card journal-card"><h2 style="font-size:16px;margin:0 0 10px">Что отслеживать?</h2><p class="mode-note">Записывай состояние кожи примерно в одно и то же время. Так будет легче сравнивать реакцию после очищения, крема и Скинорена.</p><p class="mode-note" style="margin-top:12px">Отдельный плохой день не означает, что средство не подходит. Обращай внимание на повторяющиеся реакции.</p></section></div></div></section>`}

const header=(descriptor)=>`<header class="topline"><div class="eyebrow"><span class="status-dot"></span> ritual. <span class="test-ribbon">Тест 1.1 · исправлено</span> <span style="opacity:.45">/</span> ${esc(descriptor)}</div><div class="top-actions"><button class="mini-btn" data-action="today">${svg('day','tiny')} <span class="desktop-label">Сегодня</span></button><button class="mini-btn icononly" data-action="settings" aria-label="Настройки">${svg('gear')}</button></div></header>`;
const hero=(over,title,sub,stage)=>`<section class="page-hero"><div><div class="eyebrow2">${esc(over)}</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>${stage?`<span class="phase-chip ${stage.accent==='purple'?'purple':''}">${svg('leaf','tiny')}${esc(stage.short)}</span>`:''}</section>`;
const navAdjacent=(type)=>`<div class="toolbar-buttons"><button class="mini-btn icononly" data-move="-1" data-move-type="${type}" aria-label="Предыдущий период">${svg('left')}</button><button class="mini-btn icononly" data-move="1" data-move-type="${type}" aria-label="Следующий период">${svg('chevron')}</button></div>`;
function renderDayStrip(){const mon=monday(state.selected);let out='<div class="card day-strip" aria-label="Дни недели">';for(let i=0;i<7;i++){const d=addDays(mon,i),sel=iso(d)===iso(state.selected);out+=`<button class="day-tile ${sel?'selected':''} ${isToday(d)?'today':''}" data-date="${iso(d)}" aria-label="${esc(fullDate(d))}" aria-current="${sel?'date':'false'}"><span class="wd">${wdShort[i]}</span><span class="dn">${d.getDate()}</span><span class="tiny-dot ${treatmentDay(d)?'skin':''}"></span></button>`}return out+'</div>'}
function stepRows(items,d){const done=state.done[iso(d)]||{};return `<div class="steps">${items.map((s,i)=>{const p=PRODUCTS[s.key],checked=!!done[s.id];return `<div class="step ${checked?'completed':''}"><div class="stepnum">${String(i+1).padStart(2,'0')}</div>${s.key==='water'?'<span class="product-ico water-mark" aria-label="Вода">H₂O</span>':productImage(s.key,'step')}<div class="step-details"><button class="step-open" data-product="${s.key}" title="Подробнее о средстве"><span class="prod-name">${esc(p.name)} ${s.key==='skinoren'?'<span class="tag skin">Лечение</span>':''}${s.optional?'<span class="tag opt">по желанию</span>':''}</span><span class="prod-short">${esc(s.desc)} · Подробнее ↗</span></button></div><button class="done-check ${checked?'checked':''} ${s.optional?'optional':''}" data-check="${s.id}" aria-label="${checked?'Отменить':'Отметить'}: ${esc(p.name)}" aria-pressed="${checked}">${svg('check','tiny')}</button></div>`}).join('')}</div>`}
function routineCard(kind,title,sub,items,d,note){const count=items.filter(s=>!s.optional);const done=state.done[iso(d)]||{};const c=count.filter(s=>done[s.id]).length;return `<section class="card routine"><div class="routine-header"><div class="routine-title"><span class="routine-emblem ${kind==='pm'?'night':''}">${svg(kind==='am'?'sun':'moon')}</span><div><h3>${title}</h3><small>${sub}</small></div></div><span class="routine-pct">${c} / ${count.length}</span></div>${stepRows(items,d)}${note?`<div class="routine-foot">${svg('info','tiny')}<span>${esc(note)}</span></div>`:''}</section>`}
function approvalBanner(d){const n=idxFor(d);if(n<14)return '';let a=null;if(!state.approved.start)a=approvals[0];else if(n>=21&&!state.approved.three)a=approvals[1];else if(n>=28&&!state.approved.alternate)a=approvals[2];else if(n>=42&&!state.approved.daily)a=approvals[3];if(!a)return '';const canApprove=approvalNeeded.indexOf(a.key)===0||state.approved[approvalNeeded[approvalNeeded.indexOf(a.key)-1]];return `<div class="notice warm">${svg('info')}<div><strong>Следующий этап только после подтверждения</strong><br>${esc(a.note)}<br>${canApprove?`<button data-approve="${a.key}">Подтвердить: ${esc(a.name)} →</button>`:'Сначала подтвердите предыдущий этап в разделе «Этапы».'}</div></div>`}
function dayView(){const d=state.selected,n=idxFor(d),st=stageFor(d),r=routineFor(d),p=progressFor(d);return `<section class="view-section">${header('День')}${hero('Твой уход сегодня',isToday(d)?'Сегодня — время для себя':fullDate(d),`День ${Math.max(1,n+1)} программы · ${d.getFullYear()} год`,st)}${renderDayStrip()}<div class="micro-actions"><div class="left"><button class="quiet-action ${simpleMode(d)?'active':''}" data-minimal-toggle="${iso(d)}">${svg('simplify','tiny')} ${simpleMode(d)?'Обычный уход':'Минимальный уход'}</button><button class="quiet-action" data-checkin="${iso(d)}">${svg('pen','tiny')} ${dayEntry(d)?'Изменить запись':'Как чувствует себя кожа?'}</button></div><span class="micro-caption">День ${Math.max(1,n+1)} · ${esc(st.short)}</span></div>${approvalBanner(d)}${dayEntry(d)&&safeMetric(dayEntry(d).irritation)>=3?'<div class="simple-alert">Ты отметил заметное раздражение. Не увеличивай частоту Скинорена; при выраженном жжении или стойкой красноте прекрати использование и обратись к врачу.</div>':''}${n<0?`<div class="notice warm">${svg('info')}<div>${esc(r.note)} <button data-action="settings">Настроить дату старта</button></div></div>`:`<div class="dashboard-grid"><div class="stack"><section class="card overview"><div><h2>Ритуал на день</h2><p>${p.done===p.total?'Отлично! Все обязательные шаги отмечены.':`Выполнено ${p.done} из ${p.total} обязательных шагов.`}<br>Необязательные средства не учитываются в прогрессе.</p></div><div class="progress-circle" style="--pct:${pctFor(d)}%"><b>${pctFor(d)}%</b></div></section>${routineCard('am','Утренний уход','Подготовка кожи и SPF',simpleMode(d)?r.am.filter(s=>!s.optional):r.am,d,'Твой SPF — основной утренний шаг. С кремом не перебарщивай.')}${routineCard('pm','Вечерний уход',r.treatment?'Сегодня лечение азелаиновой кислотой':'Восстановление и комфорт',simpleMode(d)?r.pm.filter(s=>!s.optional):r.pm,d,simpleMode(d)?'Минимальный режим скрывает необязательные средства. SPF, очищение и Скинорен по подтверждённому плану остаются на месте.':r.note)}</div><div class="stack">${journalShort(d)}<section class="card sidecard"><div class="section-top"><h3>Текущий этап</h3><button data-view="plan">Вся программа →</button></div><div class="stage-big">${esc(st.short)}</div><div class="stage-caption">${esc(st.name)}</div><div class="stage-bar"><div style="width:${Math.min(100,Math.round(((n-st.from+1)/(st.to-st.from+1))*100))}%"></div></div><div class="stage-advice">${esc(st.description)}</div></section><section class="card sidecard"><div class="section-top"><h3>Средства на сегодня</h3><button data-view="products">Все средства →</button></div><p class="hint-text">Нажми на средство, чтобы увидеть количество, порядок нанесения и ограничения.</p>${[...new Set([...r.am,...r.pm].map(s=>s.key))].filter(k=>k!=='water').map(k=>{const pr=PRODUCTS[k];return `<button class="product-mini" data-product="${k}">${productImage(k,'small')}<span><h4>${esc(pr.name)}</h4><p>${esc(pr.short)}</p></span>${svg('chevron','tiny')}</button>`}).join('')}</section><section class="card tip-card"><div class="tip-label">Деликатный уход</div><h4>Не больше средств.<br>А лучше — меньше.</h4><p>Не ориентируйся только на жирный блеск. Стянутость после умывания и ощущение плёнки после крема важнее, чем попытка сделать кожу идеально матовой.</p></section></div></div>`}</section>`}
function moveMonth(d,n){return new Date(d.getFullYear(),d.getMonth()+n,1)}
function weekView(){const mon=monday(state.selected),start=addDays(mon,6);let cards='';for(let i=0;i<7;i++){const d=addDays(mon,i),r=routineFor(d),p=progressFor(d),t=r.treatment;cards+=`<button class="week-day ${iso(d)===iso(state.selected)?'selected':''}" data-date="${iso(d)}" data-go-day="1"><div><div class="kicker">${wdShort[i]}</div><div class="date ${isToday(d)?'today-date':''}">${d.getDate()}</div></div><div class="week-line"><div class="week-label">Утро</div><div class="week-info">Вода · SPF</div><div class="week-label">Вечер</div><div class="week-info ${t?'purple':''}">${t?'Скинорен 15%':idxFor(d)<0?'До старта':'Базовый уход'}</div></div><div class="week-progress"><b style="width:${pctFor(d)}%"></b></div></button>`}
return `<section class="view-section">${header('Неделя')}${hero('Обзор недели','Всё под контролем','Смотри, какие дни лечебные, а какие — восстановительные.',stageFor(state.selected))}<div class="toolbar"><h2>${fmt(mon)} — ${fmt(start)}</h2>${navAdjacent('week')}</div><div class="week-grid">${cards}</div><div class="small-note">Оттенок фиолетового отмечает дни со Скинореном. Если следующий этап не подтверждён, календарь сохраняет более щадящий режим. Нажми на день, чтобы открыть полную инструкцию.</div></section>`}
function monthView(){const d=state.selected,first=new Date(d.getFullYear(),d.getMonth(),1),num=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let cells='';for(let i=0;i<dow(first);i++)cells+='<span class="cal-day blank"></span>';for(let i=1;i<=num;i++){const t=new Date(d.getFullYear(),d.getMonth(),i),p=progressFor(t),n=idxFor(t);cells+=`<button data-date="${iso(t)}" data-go-day="1" class="cal-day ${isToday(t)?'current':''} ${iso(t)===iso(d)?'selected':''} ${t<today()?'in-past':''}"><span class="num">${i}</span><span class="sub">${n>=0?stageFor(t).short:'До старта'}</span><span class="status">${n>=0?`<i class="dot ${treatmentDay(t)?'purple':'green'}"></i>`:''}${p.all?'<span class="done-mini">✓ готово</span>':''}</span></button>`}return `<section class="view-section">${header('Месяц')}${hero('Твой календарь','Месяц за месяцем','Выбери дату, чтобы увидеть подробный уход и отметить выполненные шаги.',stageFor(d))}<div class="toolbar"><h2>${monthNames[d.getMonth()]} ${d.getFullYear()}</h2><button class="mini-btn" data-view="year">Год</button>${navAdjacent('month')}</div><div class="card calendar"><div class="calendar-weekdays">${wdShort.map(x=>`<span>${x}</span>`).join('')}</div><div class="month-grid">${cells}</div></div><div class="small-note">● Зелёный — базовый уход; ● фиолетовый — вечер со Скинореном; ✓ — обязательные шаги отмечены. Изменение частоты применения требует твоего подтверждения.</div></section>`}
function miniMonth(year,month){const first=new Date(year,month,1),n=new Date(year,month+1,0).getDate();let cells='';for(let i=0;i<dow(first);i++)cells+='<span></span>';for(let i=1;i<=n;i++){const d=new Date(year,month,i);const prog=progressFor(d);cells+=`<span class="${prog.all?'done':treatmentDay(d)?'purple':''} ${isToday(d)?'today':''} ${idxFor(d)<0?'inactive':''}">${i}</span>`}return `<button class="mini-month" data-month="${month}" data-year="${year}"><h3>${monthNames[month]}</h3><div class="mini-dow">${wdShort.map(x=>`<span>${x.slice(0,1)}</span>`).join('')}</div><div class="mini-days">${cells}</div></button>`}
function yearView(){const y=state.selected.getFullYear();return `<section class="view-section">${header('Год')}${hero('Большая картина',String(y),'Все двенадцать месяцев. Чтобы открыть месяц, просто нажми на него.')}<div class="toolbar"><h2>${y} год</h2>${navAdjacent('year')}</div><p class="year-desc">Лечебные дни выделены сиреневым, полностью отмеченные — зелёным. Все данные остаются на этом устройстве.</p><div class="year-grid">${Array.from({length:12},(_,m)=>miniMonth(y,m)).join('')}</div></section>`}
function stageCard(s){const active=idxFor(state.selected)>=s.from&&idxFor(state.selected)<=s.to,n=idxFor(today());const app=s.approval?approvals.find(x=>x.key===s.approval):null,locked=app&&!state.approved[app.key],prev=app&&approvalNeeded.indexOf(app.key)>0?approvalNeeded[approvalNeeded.indexOf(app.key)-1]:null,can=app&&n>=s.from&&(!prev||state.approved[prev]);return `<section class="card phase-card ${active?'active':''}"><div class="phase-heading"><span class="phase-weeks">${esc(s.short)}</span><span class="phase-status">${active?'● Текущий этап':n>s.to?'Пройден по календарю':'Впереди'}</span></div><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p>${app?`<button class="phase-approval ${locked?'':'approved'}" data-approve="${app.key}" ${can?'':'disabled'}>${locked?'○ Подтвердить переносимость':'✓ Переход подтверждён'}</button>`:''}</section>`}
function planView(){return `<section class="view-section">${header('Этапы')}${hero('Постепенно. Без спешки.','Программа ухода','12 недель с контролируемым введением Скинорена и возможностью не увеличивать частоту.')}${approvalBanner(today())}<div class="phases">${stages.map(stageCard).join('')}</div><div class="small-note"><strong>Важно:</strong> предложенное медленное введение — осторожный план с учётом твоей стянутости и прошлой реакции на кислоты, а не замена официальной инструкции к лекарству. Стандартная схема Скинорена 15% обычно предполагает два нанесения в сутки; согласуй индивидуальный режим с дерматологом. При узлах, болезненных глубоких воспалениях или формировании рубчиков нужна очная оценка.</div></section>`}
function productsView(){return `<section class="view-section">${header('Мои средства')}${hero('Вся косметичка','Мои средства','Нажми на любую карточку, чтобы узнать, сколько наносить, когда и на какую кожу.')}<div class="catalog">${Object.entries(PRODUCTS).filter(([k])=>k!=='water').map(([k,p])=>`<button class="catalog-btn" data-product="${k}">${productImage(k,'catalog')}<span><h3>${esc(p.name)}</h3><p>${esc(p.short)}</p><span class="status ${['enzyme','toner'].includes(k)?'paused':''}">${esc(state.stock[k]==='empty'?'Закончилось':state.stock[k]==='paused'?'Пауза':p.status)} →</span></span></button>`).join('')}</div><div class="small-note">Средства Aronyx и By Wishtrend оставлены в каталоге, но намеренно не добавлены в ежедневный план. Для Aronyx нужно уточнить состав, а дополнительное отшелушивание лучше отложить.</div></section>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{const yes=b.dataset.view===state.view;b.classList.toggle('active',yes);if(yes)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const root=document.getElementById('main-content');root.innerHTML=({day:dayView,week:weekView,month:monthView,year:yearView,plan:planView,products:productsView,journal:journalView})[state.view]();document.title=`ritual. · ${state.view==='day'?fullDate(state.selected):'мой уход'}`;save()}

const compatibility={skinoren:['Допустимо: мягкая пенка DOKDO, увлажняющий крем, ежедневный SPF.','В первые недели лучше разделить с Axis-Y и Torriden, чтобы отслеживать реакцию.','Не добавляй в тот же вечер энзимную пудру, BHA и кислотные пилинги.'],cream:['Совместим со Скинореном после его впитывания.','Если появляется жирная плёнка, уменьши количество; салициловая кислота не устранит плёнку крема.'],enzyme:['Пока пауза на период привыкания к Скинорену.','При возвращении используй вместо пенки и в отдельный вечер.'],toner:['Нельзя подтвердить совместимость без полного состава Aronyx.'],sunscreen:['Последний шаг утра. Не сокращай дозу ради матовости.'],axis:['Не запрещён со Скинореном химически, но на старте проще использовать в разные вечера.']};
const productTabUI=(id,tab='overview')=>{const p=PRODUCTS[id];if(!p)return'';const stock=state.stock[id]||'have';const tabs=[['overview','Обзор'],['usage','Нанесение'],['compat','Совместимость']];let content=tab==='overview'?`<div class="info-grid"><div class="info-tile"><b>Количество</b><span>${esc(p.amount)}</span></div><div class="info-tile"><b>На какую кожу</b><span>${esc(p.skin)}</span></div><div class="info-tile"><b>Категория</b><span>${esc(p.group)}</span></div><div class="info-tile"><b>Режим</b><span>${esc(p.status)}</span></div></div><p class="mode-note">${esc(p.desc)}</p>`:tab==='usage'?`<h3 class="modal-sub">Пошаговое нанесение</h3><ol>${p.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:`<h3 class="modal-sub">Сочетаемость с твоим уходом</h3><ul class="compat-list">${(compatibility[id]||['Средство указано в твоём персональном плане. При раздражении лучше уменьшить количество необязательных этапов.']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;return `<div class="modal-tabs">${tabs.map(([key,label])=>`<button class="modal-tab ${key===tab?'active':''}" data-product-tab="${key}" data-pid="${id}">${label}</button>`).join('')}</div><div id="product-tab-area">${content}</div><p class="warning"><strong>Важно.</strong> ${esc(p.caution)}</p><div class="settings-label">В косметичке</div><div class="stock-wrap">${[['have','Есть'],['paused','Пауза'],['empty','Закончилось']].map(([k,t])=>`<button data-stock="${k}" data-stock-id="${id}" class="${stock===k?'active':''}">${t}</button>`).join('')}</div>`};

function showProduct(id,tab='overview'){const p=PRODUCTS[id];if(!p)return;showModal(`${productPhotoHero(id)}<h2 id="modal-title">${esc(p.name)}</h2><p class="lead">${esc(p.short)}</p><div id="product-modal-content">${productTabUI(id,tab)}</div>`)}
function showModal(html){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-close-backdrop="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" data-action="close" aria-label="Закрыть">${svg('close')}</button>${html}</div></div>`;document.body.style.overflow='hidden';requestAnimationFrame(()=>document.querySelector('.modal .close')?.focus())}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.style.overflow=''}
function settings(){showModal(`<h2 id="modal-title">Настройки программы</h2><p class="lead">Настрой дату начала и сохрани дневник. Прогресс хранится только в этом браузере.</p><label class="settings-label" for="start-input">Первый день программы</label><input class="settings-input" type="date" id="start-input" value="${state.startDate}" min="2020-01-01" max="2035-12-31"><p class="setting-help">От этой даты отсчитываются недели 1, 2, 3–4 и следующие этапы. При изменении даты уже отмеченные календарные дни не очищаются.</p><div class="modal-actions"><button class="modal-action" data-action="save-settings">Сохранить дату</button></div><label class="settings-label" for="theme-input">Тема интерфейса</label><select class="theme-select" id="theme-input"><option value="system" ${state.theme==='system'?'selected':''}>Как на устройстве</option><option value="light" ${state.theme==='light'?'selected':''}>Светлая</option><option value="dark" ${state.theme==='dark'?'selected':''}>Тёмная</option></select><div class="modal-actions"><button class="modal-action secondary" data-action="save-theme">Применить тему</button></div><label class="settings-label">Данные</label><div class="modal-actions"><button class="modal-action secondary" data-action="export">${svg('download','tiny')} Скачать копию</button><button class="modal-action secondary" data-action="import">Восстановить из копии</button><input type="file" id="import-file" accept="application/json,.json" style="display:none"></div><p class="setting-help">Резервная копия включает календарь, дневник, выбранную тему, минимальный уход и статусы косметики.</p><div class="modal-actions"><button class="modal-action danger" data-action="reset">Сбросить отметки и подтверждения</button></div><p class="fine-print">Это личный план-напоминание, не медицинская диагностика и не индивидуальное назначение препарата. При выраженном раздражении, болезненных узлах, рубцевании или отсутствии улучшения необходим дерматолог.</p>`)}
function showApproval(key){const a=approvals.find(x=>x.key===key);if(!a)return;const before=approvalNeeded[approvalNeeded.indexOf(key)-1];if(before&&!state.approved[before])return; if(state.approved[key]){showModal(`<h2 id="modal-title">Этап подтверждён</h2><p class="lead">${esc(a.name)}. Если раздражение усилилось, ты можешь отменить этот и все последующие этапы.</p><div class="modal-actions"><button class="modal-action danger" data-confirm-revoke="${key}">Отменить повышение частоты</button><button class="modal-action secondary" data-action="close">Оставить как есть</button></div>`);return}showModal(`<h2 id="modal-title">${esc(a.name)}</h2><p class="lead">${esc(a.week)}. Этот переход не происходит автоматически: важно, чтобы предыдущий режим хорошо переносился.</p><div class="notice warm" style="margin:0">${svg('info')}<div>${esc(a.note)}<br>При стойком жжении, красноте или шелушении отложи повышение частоты.</div></div><div class="modal-actions"><button class="modal-action" data-confirm-approve="${key}">Да, кожа переносит хорошо</button><button class="modal-action secondary" data-action="close">Пока не готов</button></div>`)}
function approve(key,on){const i=approvalNeeded.indexOf(key);if(i<0)return;if(on){approvalNeeded.slice(0,i+1).forEach(k=>state.approved[k]=true)}else{approvalNeeded.slice(i).forEach(k=>delete state.approved[k])}save();closeModal();render()}
function downloadBackup(){const json=JSON.stringify({app:'ritual',version:2,exportedAt:new Date().toISOString(),startDate:state.startDate,done:state.done,approved:state.approved,journal:state.journal,minimalDays:state.minimalDays,stock:state.stock,theme:state.theme},null,2);const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`ritual-backup-${iso(today())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function navigateView(view){state.view=view;closeModal();render();window.scrollTo({top:0,behavior:'instant'})}
function changeDate(d,toDay=false){state.selected=d;if(toDay)state.view='day';render();window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.dataset.closeBackdrop)closeModal();return}if(b.dataset.closeBackdrop)return;
 if(b.dataset.minimalToggle){const d=b.dataset.minimalToggle;state.minimalDays[d]=!state.minimalDays[d];save();render();return}
 if(b.dataset.checkin){showCheckin(parse(b.dataset.checkin));return}
 if(b.dataset.productTab){const area=document.getElementById('product-modal-content');if(area)area.innerHTML=productTabUI(b.dataset.pid,b.dataset.productTab);return}
 if(b.dataset.stock){state.stock[b.dataset.stockId]=b.dataset.stock;save();render();const area=document.getElementById('product-modal-content');if(area)area.innerHTML=productTabUI(b.dataset.stockId,'overview');return}
 if(b.dataset.view){navigateView(b.dataset.view);return}
 if(b.dataset.product){showProduct(b.dataset.product);return}
 if(b.dataset.check){const id=iso(state.selected);state.done[id]??={};state.done[id][b.dataset.check]=!state.done[id][b.dataset.check];save();render();return}
 if(b.dataset.date){changeDate(parse(b.dataset.date),!!b.dataset.goDay);return}
 if(b.dataset.month!==undefined){changeDate(new Date(Number(b.dataset.year),Number(b.dataset.month),1));state.view='month';render();return}
 if(b.dataset.move){const n=Number(b.dataset.move),t=b.dataset.moveType,d=state.selected;changeDate(t==='week'?addDays(d,n*7):t==='month'?moveMonth(d,n):new Date(d.getFullYear()+n,d.getMonth(),1));return}
 if(b.dataset.approve){showApproval(b.dataset.approve);return}
 if(b.dataset.confirmApprove){approve(b.dataset.confirmApprove,true);return}
 if(b.dataset.confirmRevoke){approve(b.dataset.confirmRevoke,false);return}
 if(b.dataset.action==='save-checkin'){
  const dt=b.dataset.jdate;if(!dateValid(dt))return;const entry={};for(const f of journalFields){entry[f.key]=safeMetric(document.getElementById('field-'+f.key)?.value)}entry.breakouts=Math.max(0,Math.min(20,Number(document.getElementById('field-breakouts')?.value)||0));entry.notes=document.getElementById('field-notes')?.value.slice(0,350)||'';state.journal[dt]=entry;save();closeModal();render();return}
 if(b.dataset.action==='save-theme'){const t=document.getElementById('theme-input')?.value;if(['system','light','dark'].includes(t)){state.theme=t;applyTheme();save()}closeModal();render();return}
 if(b.dataset.action==='close'){closeModal();return}
 if(b.dataset.action==='settings'){settings();return}
 if(b.dataset.action==='today'){changeDate(today(),true);return}
 if(b.dataset.action==='save-settings'){const inp=document.getElementById('start-input');if(!dateValid(inp.value)){alert('Выбери корректную дату.');return}state.startDate=inp.value;save();closeModal();render();return}
 if(b.dataset.action==='export'){downloadBackup();return}
 if(b.dataset.action==='import'){document.getElementById('import-file')?.click();return}
 if(b.dataset.action==='reset'){if(confirm('Удалить все выполненные шаги и подтверждения этапов? Дата начала сохранится.')){state.done={};state.approved={};save();closeModal();render()}return}
});
document.addEventListener('input',e=>{if(e.target.dataset.range){const o=document.getElementById('value-'+e.target.dataset.range);if(o)o.textContent=e.target.value+(e.target.dataset.range==='breakouts'?'':'/5')}});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'&&e.target.files?.[0]){try{const data=JSON.parse(await e.target.files[0].text());if(!dateValid(data.startDate)||!data.done||typeof data.done!=='object'||!data.approved||typeof data.approved!=='object')throw Error('Неверный формат');if(!confirm('Импорт заменит записи и подтверждения этапов в тестовой версии. Продолжить?'))return;state.startDate=data.startDate;state.done=data.done;state.approved=data.approved;state.journal=data.journal&&typeof data.journal==='object'?data.journal:{};state.minimalDays=data.minimalDays&&typeof data.minimalDays==='object'?data.minimalDays:{};state.stock=data.stock&&typeof data.stock==='object'?data.stock:{};state.theme=['system','light','dark'].includes(data.theme)?data.theme:'system';applyTheme();save();closeModal();render()}catch(err){alert('Не удалось прочитать резервную копию: '+err.message)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if(!document.querySelector('.modal')&&state.view==='day'&&['ArrowLeft','ArrowRight'].includes(e.key)){changeDate(addDays(state.selected,e.key==='ArrowLeft'?-1:1))}});
render();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {}));
}
</script>
</body>
</html>
